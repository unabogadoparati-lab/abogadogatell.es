{% extends "base.html" %}

{% block content %}
<article class="post">
    <header class="post-header">
        <h1>{{ post_title }}</h1>
        <p class="post-meta">Publicado el {{ post_date }} por {{ post_author }}</p>
    </header>
    <div class="post-content">
        {{ post_content }}
    </div>
    <footer class="post-footer">
        <p>Etiquetas: {{ post_tags | join(', ') }}</p>
    </footer>
</article>
{% endblock %}
