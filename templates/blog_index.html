{% extends "base.html" %}

{% block content %}
<h1>Blog</h1>
<div class="posts-list">
    {% for post in posts %}
    <article class="post-preview">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p class="post-meta">Publicado el {{ post.date }}</p>
        <p class="post-excerpt">{{ post.excerpt }}</p>
        <a href="{{ post.url }}" class="read-more">Leer más</a>
    </article>
    {% endfor %}
</div>
{% endblock %}
